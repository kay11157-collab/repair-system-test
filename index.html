<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機台維修管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 pb-16 p-4">

<div class="max-w-5xl mx-auto space-y-6">
  <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
    <h1 class="text-xl font-bold text-gray-800">🛠️ 機台維修管理系統</h1>
    <span id="syncStatus" class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded">連線中...</span>
  </header>

  <!-- 新增維修單表單 -->
  <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
    <h2 class="text-lg font-semibold mb-4 text-gray-700">新增維修紀錄</h2>
    <form id="repairForm" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">報修日期</label>
        <input type="date" id="f_date" required class="w-full border rounded-lg px-3 py-2 text-sm bg-gray-50">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">機台編號 / 名稱</label>
        <input type="text" id="f_machine" placeholder="例: CNC-01" required class="w-full border rounded-lg px-3 py-2 text-sm bg-gray-50">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">故障狀況</label>
        <input type="text" id="f_issue" placeholder="例: 軸承異音" required class="w-full border rounded-lg px-3 py-2 text-sm bg-gray-50">
      </div>
      <div class="sm:col-span-3">
        <label class="block text-xs font-medium text-gray-600 mb-1">處理方式與備註</label>
        <textarea id="f_remark" placeholder="例: 更換新軸承並上油測試" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm bg-gray-50"></textarea>
      </div>
      <div class="sm:col-span-3">
        <button type="submit" id="submitBtn" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 w-full sm:w-auto">送出維修單</button>
      </div>
    </form>
  </section>

  <!-- 維修列表區塊 -->
  <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="p-4 border-b bg-gray-50">
      <h2 class="text-lg font-semibold text-gray-700">維修紀錄列表</h2>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-gray-100 text-gray-600 border-b">
          <tr>
            <th class="py-3 px-4">日期</th>
            <th class="py-3 px-4">機台</th>
            <th class="py-3 px-4">故障狀況</th>
            <th class="py-3 px-4">處理備註</th>
            <th class="py-3 px-4 text-center">操作</th>
          </tr>
        </thead>
        <tbody id="repairTableBody" class="divide-y divide-gray-200"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxseS8q28OIflZmL0cMq1wNnvlP201g1dX5lT6oY_wHriq37CejrcRXqJ1fcqcY1WelUQ/exec';
let repairList = [];

document.getElementById('f_date').valueAsDate = new Date();

async function fetchRepairs() {
  try {
    const response = await fetch(SCRIPT_URL);
    const data = await response.json();
    repairList = data;
    document.getElementById('syncStatus').className = 'text-xs bg-green-100 text-green-800 px-2 py-1 rounded';
    document.getElementById('syncStatus').textContent = '✅ 已連線';
    renderTable();
  } catch (error) {
    document.getElementById('syncStatus').className = 'text-xs bg-red-100 text-red-800 px-2 py-1 rounded';
    document.getElementById('syncStatus').textContent = '❌ 載入失敗';
    console.error(error);
  }
}

async function postToSheet(payload) {
  return fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  });
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 7); }

document.getElementById('repairForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    action: 'add',
    data: {
      id: genId(),
      date: document.getElementById('f_date').value,
      machine: document.getElementById('f_machine').value.trim(),
      issue: document.getElementById('f_issue').value.trim(),
      remark: document.getElementById('f_remark').value.trim()
    }
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '儲存中...';

  try {
    await postToSheet(payload);
    repairList.push(payload.data);
    document.getElementById('repairForm').reset();
    document.getElementById('f_date').valueAsDate = new Date();
    renderTable();
  } catch (error) {
    alert('儲存失敗，請檢查網路連線');
  }
  btn.disabled = false; btn.textContent = '送出維修單';
});

window.deleteRepair = async function(id) {
  if (!confirm('確定要刪除這筆維修紀錄嗎？')) return;
  try {
    await postToSheet({ action: 'delete', id: id });
    repairList = repairList.filter(item => item.id !== id);
    renderTable();
  } catch (error) {
    alert('刪除失敗');
  }
};

function renderTable() {
  const tbody = document.getElementById('repairTableBody');
  if (repairList.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400">目前沒有維修紀錄</td></tr>`;
    return;
  }
  tbody.innerHTML = [...repairList].reverse().map(item => `
    <tr class="hover:bg-gray-50">
      <td class="py-3 px-4">${item.date || ''}</td>
      <td class="py-3 px-4 font-medium text-gray-800">${item.machine || ''}</td>
      <td class="py-3 px-4 text-gray-600">${item.issue || ''}</td>
      <td class="py-3 px-4 text-gray-600">${item.remark || ''}</td>
      <td class="py-3 px-4 text-center">
        <button onclick="deleteRepair('${item.id}')" class="text-red-500 hover:text-red-700 text-xs bg-red-50 px-2 py-1 rounded">刪除</button>
      </td>
    </tr>
  `).join('');
}

fetchRepairs();
</script>
</body>
</html>
