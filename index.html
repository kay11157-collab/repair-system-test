<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票批次損益帳本</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --accent:#8a6a1f; --gain:#b6412f; --loss:#2f7d55; }
  body { background: #f6f4ef; color: #2b2620; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
</head>
<body class="min-h-screen pb-16 p-4">

<div class="max-w-6xl mx-auto space-y-6">
  <header class="flex justify-between items-center">
    <h1 class="text-2xl font-bold">股票批次損益帳本</h1>
    <span id="syncStatus" class="text-xs bg-yellow-200 text-yellow-800 px-2 py-1 rounded">資料載入中...</span>
  </header>

  <!-- 交易輸入表單 -->
  <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
    <h2 class="text-lg font-semibold mb-4">新增交易紀錄</h2>
    <form id="txForm" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
      <input type="date" id="f_date" required class="border rounded-lg px-2 py-2 text-sm bg-gray-50">
      <input type="text" id="f_symbol" placeholder="代號 (例:8464)" required class="border rounded-lg px-2 py-2 text-sm bg-gray-50">
      <input type="text" id="f_name" placeholder="名稱 (例:億豐)" required class="border rounded-lg px-2 py-2 text-sm bg-gray-50">
      <select id="f_type" class="border rounded-lg px-2 py-2 text-sm bg-gray-50">
        <option value="buy">買進</option>
        <option value="sell">賣出</option>
      </select>
      <input type="number" id="f_price" placeholder="單價" step="0.01" required class="border rounded-lg px-2 py-2 text-sm bg-gray-50">
      <input type="number" id="f_qty" placeholder="股數" required class="border rounded-lg px-2 py-2 text-sm bg-gray-50">
      <input type="number" id="f_discount" placeholder="手續費折讓" step="0.1" value="2.8" required class="border rounded-lg px-2 py-2 text-sm bg-gray-50">
      
      <div id="lotFieldWrapper" class="hidden col-span-2 sm:col-span-4 lg:col-span-7">
        <label class="block text-xs font-medium text-[var(--gain)] mb-1">賣出來源批次（指定要扣除哪一批買進）</label>
        <select id="f_lot" class="w-full border bg-red-50 rounded-lg px-2 py-2 text-sm"></select>
      </div>

      <div class="col-span-2 sm:col-span-4 lg:col-span-7 pt-2">
        <button type="submit" id="submitBtn" class="bg-[var(--accent)] text-white px-5 py-2 rounded-lg text-sm w-full sm:w-auto hover:opacity-90">新增紀錄</button>
      </div>
    </form>
  </section>

  <!-- 庫存與歷史紀錄區塊 -->
  <section>
    <h2 class="text-lg font-semibold mb-3">持股總覽</h2>
    <div id="dashboard" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8"></div>
    <h2 class="text-lg font-semibold mb-3">歷史紀錄</h2>
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
      <table class="w-full text-sm text-left min-w-[800px]">
        <thead class="bg-gray-100 border-b">
          <tr>
            <th class="py-2 px-3">日期</th><th class="py-2 px-3">股票</th><th class="py-2 px-3">類別</th>
            <th class="py-2 px-3 text-right">單價</th><th class="py-2 px-3 text-right">股數</th><th class="py-2 px-3 text-right">總淨額</th>
            <th class="py-2 px-3 text-center">操作</th>
          </tr>
        </thead>
        <tbody id="txTableBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
// ==========================================
// ⚠️ 請替換成你剛剛部署 Google Apps Script 取得的 URL
// ==========================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYOUR_SCRIPT_ID/exec';

let txList = [];
const FEE_RATE = 0.001425;
const TAX_RATE = 0.003;

// 初始化載入資料
async function fetchTransactions() {
  try {
    const response = await fetch(SCRIPT_URL);
    const data = await response.json();
    txList = data.map(item => ({
      ...item,
      // 確保從 Google Sheets 拿回來的日期格式正確
      date: item.date.includes('T') ? item.date.split('T')[0] : item.date
    }));
    document.getElementById('syncStatus').className = 'text-xs bg-green-200 text-green-800 px-2 py-1 rounded';
    document.getElementById('syncStatus').textContent = '✅ 已與 Google Sheets 同步';
    renderAll();
  } catch (error) {
    document.getElementById('syncStatus').className = 'text-xs bg-red-200 text-red-800 px-2 py-1 rounded';
    document.getElementById('syncStatus').textContent = '❌ 載入失敗';
    console.error(error);
  }
}

// 送出資料到 GAS
async function postToSheet(payload) {
  return fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  });
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 7); }
function round2(n) { return Math.round(n * 100) / 100; }
function fmt(n) { return Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 }); }

function computeTxFields(input) {
  const amount = round2(input.price * input.qty);
  const fee = Math.ceil(amount * FEE_RATE * (input.discount / 10));
  const tax = input.type === 'sell' ? Math.ceil(amount * TAX_RATE) : 0;
  const net = input.type === 'buy' ? amount + fee : amount - fee - tax;
  return {
    id: genId(), date: input.date, symbol: input.symbol.trim(), name: input.name.trim(), 
    type: input.type, price: Number(input.price), qty: Number(input.qty), 
    discount: Number(input.discount), lotId: input.type === 'sell' ? (input.lotId || '') : '',
    amount, fee, tax, net
  };
}

function getOpenLots(symbol) {
  const buys = txList.filter(t => t.symbol === symbol && t.type === 'buy');
  const sells = txList.filter(t => t.symbol === symbol && t.type === 'sell');
  const lots = buys.map(b => ({ id: b.id, date: b.date, price: b.price, remainingQty: b.qty, costPerShare: b.net / b.qty }));
  const lotMap = Object.fromEntries(lots.map(l => [l.id, l]));
  for (const s of sells) {
    if (lotMap[s.lotId]) lotMap[s.lotId].remainingQty -= s.qty;
  }
  return lots.filter(l => l.remainingQty > 0);
}

document.getElementById('f_type').addEventListener('change', refreshLotOptions);
document.getElementById('f_symbol').addEventListener('input', refreshLotOptions);
document.getElementById('f_date').valueAsDate = new Date();

function refreshLotOptions() {
  const wrapper = document.getElementById('lotFieldWrapper');
  const sel = document.getElementById('f_lot');
  const type = document.getElementById('f_type').value;
  const symbol = document.getElementById('f_symbol').value.trim();

  if (type !== 'sell' || !symbol) {
    wrapper.classList.add('hidden');
    sel.innerHTML = '';
    return;
  }
  wrapper.classList.remove('hidden');
  const lots = getOpenLots(symbol);
  if (lots.length === 0) {
    sel.innerHTML = '<option value="">(目前無可賣出的買進批次)</option>';
  } else {
    sel.innerHTML = lots.map(l => `<option value="${l.id}">${l.date} 買進 @${fmt(l.price)} (剩餘 ${fmt(l.remainingQty)} 股)</option>`).join('');
  }
}

document.getElementById('txForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const type = document.getElementById('f_type').value;
  const input = {
    date: document.getElementById('f_date').value,
    symbol: document.getElementById('f_symbol').value,
    name: document.getElementById('f_name').value,
    type,
    price: document.getElementById('f_price').value,
    qty: document.getElementById('f_qty').value,
    discount: document.getElementById('f_discount').value,
    lotId: type === 'sell' ? document.getElementById('f_lot').value : null,
  };

  if (type === 'sell' && !input.lotId) { alert('請選擇要賣出的買進批次'); return; }
  
  const data = computeTxFields(input);
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '寫入 Google Sheets 中...';

  try {
    await postToSheet({ action: 'add', data: data });
    txList.push(data); // 本地端先更新畫面，不用等重新拉取
    document.getElementById('txForm').reset();
    document.getElementById('f_discount').value = '2.8';
    document.getElementById('f_date').valueAsDate = new Date();
    refreshLotOptions();
    renderAll();
  } catch (error) {
    alert("儲存失敗，請檢查連線。");
  }
  btn.disabled = false; btn.textContent = '新增紀錄';
});

window.deleteTx = async function(id) {
  if (!confirm('確定要從 Google Sheets 刪除這筆紀錄嗎？')) return;
  
  try {
    await postToSheet({ action: 'delete', id: id });
    txList = txList.filter(t => t.id !== id);
    renderAll();
  } catch (error) {
    alert("刪除失敗。");
  }
}

function computeStockStats(symbol) {
  const buys = txList.filter(t => t.symbol === symbol && t.type === 'buy');
  const sells = txList.filter(t => t.symbol === symbol && t.type === 'sell');
  const lots = {};
  for (const b of buys) lots[b.id] = { costPerShare: b.net / b.qty, remainingQty: 0 };
  
  let realizedPnL = 0, runningCost = 0;
  for (const t of txList.filter(t => t.symbol === symbol)) {
    if (t.type === 'buy') {
      lots[t.id].remainingQty += t.qty;
      runningCost += t.qty * lots[t.id].costPerShare;
    } else {
      const lot = lots[t.lotId];
      if (lot) {
        const costRemoved = lot.costPerShare * t.qty;
        realizedPnL += (t.net - costRemoved);
        lot.remainingQty -= t.qty;
        runningCost -= costRemoved;
      }
    }
  }
  const qty = Object.values(lots).reduce((sum, l) => sum + l.remainingQty, 0);
  const avgCost = qty > 0 ? runningCost / qty : 0;
  return { name: (buys[0] || sells[0]).name, qty, avgCost, realizedPnL };
}

function renderAll() {
  const symbols = Array.from(new Set(txList.map(t => t.symbol))).sort();
  const dash = document.getElementById('dashboard');
  if (symbols.length === 0) dash.innerHTML = '<p class="text-gray-500">尚無資料</p>';
  else {
    dash.innerHTML = symbols.map(sym => {
      const s = computeStockStats(sym);
      return `
      <div class="bg-white border rounded-xl p-4">
        <h3 class="font-bold text-lg mb-2">${s.name} <span class="text-gray-500 text-sm">(${sym})</span></h3>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="text-gray-500">持有股數</div><div class="text-right font-medium">${fmt(s.qty)}</div>
          <div class="text-gray-500">平均買進成本</div><div class="text-right font-medium">${s.qty > 0 ? fmt(s.avgCost) : '—'}</div>
          <div class="text-gray-500">已實現損益</div>
          <div class="text-right font-bold ${s.realizedPnL >= 0 ? 'text-[var(--gain)]' : 'text-[var(--loss)]'}">${fmt(s.realizedPnL)}</div>
        </div>
      </div>`;
    }).join('');
  }

  const tbody = document.getElementById('txTableBody');
  const revList = [...txList].reverse();
  tbody.innerHTML = revList.map(t => `
    <tr class="border-b hover:bg-gray-50">
      <td class="py-2 px-3">${t.date}</td>
      <td class="py-2 px-3 font-medium">${t.symbol} ${t.name}</td>
      <td class="py-2 px-3"><span class="px-2 py-1 rounded text-xs ${t.type === 'buy' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">${t.type === 'buy' ? '買進' : '賣出'}</span></td>
      <td class="py-2 px-3 text-right num">${fmt(t.price)}</td>
      <td class="py-2 px-3 text-right num">${fmt(t.qty)}</td>
      <td class="py-2 px-3 text-right num font-medium">${fmt(t.net)}</td>
      <td class="py-2 px-3 text-center">
        <button onclick="deleteTx('${t.id}')" class="text-red-500 hover:underline text-sm">刪除</button>
      </td>
    </tr>
  `).join('');
}

// 啟動載入
fetchTransactions();
</script>
</body>
</html>
